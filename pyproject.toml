[build-system]
requires =["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "filelock-lts"
version = "2026.22701.1"
description = "LTS Security release for filelock (CVE-2025-68146 & CVE-2026-22701 Patch) - Meta-package"
requires-python = ">=3.7"
license = {text = "Unlicense"}
readme = "README.md"
classifiers =[
    "Topic :: Security",
    "Intended Audience :: Developers"
]
dependencies =[
    "filelock-lts-py37==2026.22701.1 ; python_version >= '3.7' and python_version < '3.8'",
    "filelock-lts-py38==2026.22701.1 ; python_version >= '3.8' and python_version < '3.9'",
    "filelock-lts-py39==2026.22701.1 ; python_version >= '3.9' and python_version < '3.10'",
    "filelock>=3.20.1 ; python_version >= '3.10'"
]

[project.urls]
Homepage = "https://github.com/1minds3t/filelock-lts"
"Security" = "https://github.com/1minds3t/filelock-lts/blob/main/SECURITY.md"
