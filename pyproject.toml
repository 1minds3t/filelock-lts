[build-system]
requires = ["setuptools>=61.0",
    "pip>=24.1"
]
build-backend = "setuptools.build_meta"

[project]
name = "filelock_lts_py38"
version = "2026.22701"
description = "Python 3.8 filelock with CVE-2025-68146 and CVE-2026-22701 security patches (symlink/TOCTOU attack prevention via O_NOFOLLOW)"
requires-python = ">=3.8, <3.9"
license = {text = "Unlicense"}
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3.8",
    "Topic :: Security",
    "Intended Audience :: Developers"
]

[project.urls]
Homepage = "https://github.com/1minds3t/filelock-lts"
"CVE Details" = "https://nvd.nist.gov/vuln/detail/CVE-2025-68146"
"Source" = "https://github.com/1minds3t/filelock-lts/tree/py3.8"

[conflicts]
filelock = "*"
