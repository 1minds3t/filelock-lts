name: Publish filelock-lts-py37 to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (build tool)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Verify version matches tag
        run: |
          PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          EXPECTED_VERSION="${{ github.ref_name }}"
          EXPECTED_VERSION="${EXPECTED_VERSION#CVE-}"
          if [ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Version mismatch! Expected $EXPECTED_VERSION but found $PACKAGE_VERSION."
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Verify works on Python 3.7 via Docker
        run: |
          docker run --rm -v ${{ github.workspace }}/dist:/dist \
            python:3.7-slim \
            sh -c "pip install /dist/*.whl && python -c 'import filelock; print(\"✅ works on Python 3.7!\")'"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
