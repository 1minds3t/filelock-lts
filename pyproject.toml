[build-system]
requires = ["setuptools>=61.0",
    "pip>=24.1"
]
build-backend = "setuptools.build_meta"

[project]
name = "filelock_lts_py37"
version = "2026.22701"
description = "Python 3.7 filelock with CVE-2025-68146 and CVE-2026-22701 security patches (TOCTOU symlink attack prevention)"
requires-python = ">=3.7, <3.8"
license = {text = "Unlicense"}
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: The Unlicense (Unlicense)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Topic :: System",
]

[project.urls]
Homepage = "https://github.com/1minds3t/filelock-lts"
"Source" = "https://github.com/1minds3t/filelock-lts/tree/lts-py37"
"CVE-2025-68146" = "https://nvd.nist.gov/vuln/detail/CVE-2025-68146"
"CVE-2026-22701" = "https://www.cve.org/CVERecord?id=CVE-2026-22701"
"Security Patches" = "https://github.com/1minds3t/filelock-lts/blob/lts-py37/security/PATCHES.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE"]

[conflicts]
filelock = "*"
